<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<link rel="stylesheet" href="/common.css">
<script defer src="/api.js"></script>
<script defer src="./view.js"></script>
<title>JS Gain</title>
<main><label for='gain'>GAIN</label><input id='gain' type='range' min='25' max='200' value='100'><output id='level' for='gain'>100%</output></main>
<nav aria-label="Card layout">
  <button data-layout="both">BOTH</button>
  <button data-layout="tall">TALL CARD</button>
  <button data-layout="spectrum">SPECTRUM</button>
  <button data-layout="waterfall">WATERFALL</button>
  <button data-layout="card">CARD ONLY</button>
  <small id='status' role='status'></small>
  <button id='play'>START</button>
</nav>
</html>
